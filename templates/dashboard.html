<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P6D Class Monitor - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }

        .clock {
            font-size: 1.2rem;
            font-weight: bold;
            color: #94a3b8;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1fr solid #334155;
            background-color: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        .search-box:focus {
            border-color: #38bdf8;
        }

        .student-list {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: #0f172a;
            border-radius: 8px;
        }

        .student-item span {
            font-weight: 500;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-in { background-color: #059669; color: #ecfdf5; }
        .status-out { background-color: #dc2626; color: #fef2f2; }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary { background-color: #0284c7; color: #fff; }
        .btn-primary:hover { background-color: #0369a1; }
        .btn-danger { background-color: #e11d48; color: #fff; }
        .btn-danger:hover { background-color: #be123c; }
        .btn-secondary { background-color: #475569; color: #fff; }
        .btn-secondary:hover { background-color: #334155; }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .event-card {
            background-color: #0f172a;
            padding: 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #38bdf8;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .event-time {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .event-actions {
            display: flex;
            gap: 8px;
        }

        .history-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .modal-content h3 {
            margin-bottom: 10px;
            color: #f8fafc;
        }

        .modal-content p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>P6D Class Monitor Dashboard 🏫</h1>
        <div class="clock" id="liveClock">00:00:00 AM</div>
    </div>

    <div class="container">
        <!-- Left Panel: Roster -->
        <div>
            <div class="card">
                <h2>
                    Students List
                    <button class="btn btn-secondary" onclick="scrollToHistory()">📚 History</button>
                </h2>
                <input type="text" id="searchInput" class="search-box" placeholder="Search student name..." onkeyup="filterStudents()">
                <div class="student-list" id="studentList">
                    <!-- Dynamic Student Rows Render Here -->
                </div>
            </div>
        </div>

        <!-- Right Panel: Logs & History -->
        <div>
            <!-- Active Today Section -->
            <div class="card">
                <h2>Today's Events ⏱️</h2>
                <div class="event-list" id="todayEvents">
                    <p style="color: #64748b;">No active logs today...</p>
                </div>
            </div>

            <!-- History Logs Section -->
            <div class="card" id="historySection">
                <h2>Past Event History 📜</h2>
                <div class="history-controls">
                    <button class="btn btn-secondary" onclick="deleteSelectedHistory()">Delete Selected</button>
                    <button class="btn btn-danger" onclick="askDeleteAllHistory()">Delete All History</button>
                </div>
                <div class="event-list" id="historyEvents">
                    <p style="color: #64748b;">No history records found...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3 id="modalTitle">Confirm Action</h3>
            <p id="modalMessage">Are you sure you want to perform this action?</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-danger" id="modalConfirmButton">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           DATA & INITIALIZATION
        ========================================================= */
        const registeredStudents = [
            "Aung Aung", "Ba Maung", "Cho Cho", "Daw Daw", "Ei Ei",
            "Hla Hla", "Kyaw Kyaw", "Mg Mg", "Mya Mya", "Nilar",
            "Oo Oo", "Phyu Phyu", "Sithu", "Thida", "Tun Tun",
            "Wai Wai", "Win Win", "Yamin", "Zaw Zaw", "Zin Zin",
            "Hein Thant", "Hudson", "Koko", "Nang Nang", "Su Su"
        ];

        let events = [];

        /* Update Live Clock */
        setInterval(() => {
            document.getElementById("liveClock").textContent = new Date().toLocaleTimeString();
        }, 1000);

        /* Render Student Roster */
        function renderStudents(filter = "") {
            const listEl = document.getElementById("studentList");
            listEl.innerHTML = "";

            const filtered = registeredStudents.filter(name => 
                name.toLowerCase().includes(filter.toLowerCase())
            );

            filtered.forEach(name => {
                const item = document.createElement("div");
                item.className = "student-item";
                item.innerHTML = `
                    <span>${name}</span>
                    <span class="status-badge status-in">Present</span>
                `;
                listEl.appendChild(item);
            });
        }

        function filterStudents() {
            const query = document.getElementById("searchInput").value;
            renderStudents(query);
        }

        /* Helper to check if date is today */
        function isToday(timeStr) {
            const eventDate = new Date(timeStr);
            const today = new Date();
            return eventDate.toDateString() === today.toDateString();
        }

        /* Helper to generate event IDs */
        function getEventId(event, index) {
            return event.id || index;
        }

        /* Helper to grab selected history checkbox IDs */
        function getSelectedHistory() {
            const checkboxes = document.querySelectorAll('.history-checkbox:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        /* Fetch Latest Event Data from API */
        async function refreshData() {
            try {
                const response = await fetch('/api/events');
                if (!response.ok) return;
                events = await response.json();
                renderEvents();
            } catch (err) {
                console.log("Waiting for backend API server connection...");
            }
        }

        /* Send Delete Event Request to API */
        async function deleteEvent(id) {
            await fetch(`/api/events/${id}`, { method: 'DELETE' });
        }

        /* Render Today & History Cards */
        function renderEvents() {
            const todayEl = document.getElementById("todayEvents");
            const historyEl = document.getElementById("historyEvents");

            todayEl.innerHTML = "";
            historyEl.innerHTML = "";

            const todayList = events.filter(e => isToday(e.time));
            const historyList = events.filter(e => !isToday(e.time));

            if (todayList.length === 0) {
                todayEl.innerHTML = `<p style="color: #64748b;">No active logs today...</p>`;
            } else {
                todayList.forEach((e, idx) => {
                    const id = getEventId(e, idx);
                    todayEl.innerHTML += `
                        <div class="event-card">
                            <div class="event-info">
                                <strong>${e.studentName || 'Student'} - ${e.type || 'Event'}</strong>
                                <span class="event-time">${new Date(e.time).toLocaleString()}</span>
                            </div>
                            <div class="event-actions">
                                <button class="btn btn-danger" onclick="askDeleteSingle('${id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }

            if (historyList.length === 0) {
                historyEl.innerHTML = `<p style="color: #64748b;">No history records found...</p>`;
            } else {
                historyList.forEach((e, idx) => {
                    const id = getEventId(e, idx);
                    historyEl.innerHTML += `
                        <div class="event-card">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <input type="checkbox" class="history-checkbox" value="${id}">
                                <div class="event-info">
                                    <strong>${e.studentName || 'Student'} - ${e.type || 'Event'}</strong>
                                    <span class="event-time">${new Date(e.time).toLocaleString()}</span>
                                </div>
                            </div>
                            <div class="event-actions">
                                <button class="btn btn-danger" onclick="askDeleteSingle('${id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        /* =========================================================
           DELETE SELECTED HISTORY
        ========================================================= */
        function deleteSelectedHistory() {
            const ids = getSelectedHistory();

            if (ids.length === 0) {
                showModal(
                    "Nothing selected",
                    "Select one or more history events first.",
                    null,
                    "OK"
                );
                return;
            }

            showModal(
                "Delete selected history?",
                `You selected ${ids.length} event${ids.length === 1 ? "" : "s"}. Are you sure you want to delete them?`,
                async () => {
                    try {
                        for (const id of ids) {
                            await deleteEvent(id);
                        }
                        closeModal();
                        await refreshData();
                    } catch (error) {
                        console.error(error);
                        closeModal();
                        showModal(
                            "Delete failed",
                            "The server could not delete one or more events.",
                            null,
                            "OK"
                        );
                    }
                }
            );
        }

        /* =========================================================
           DELETE SINGLE EVENT
        ========================================================= */
        function askDeleteSingle(eventId) {
            showModal(
                "Delete event?",
                "Are you sure you want to delete this event?",
                async () => {
                    try {
                        await deleteEvent(eventId);
                        closeModal();
                        await refreshData();
                    } catch (error) {
                        console.error(error);
                        closeModal();
                        showModal(
                            "Delete failed",
                            "The server could not delete this event.",
                            null,
                            "OK"
                        );
                    }
                }
            );
        }

        /* =========================================================
           DELETE ALL HISTORY
        ========================================================= */
        function askDeleteAllHistory() {
            const historyEvents = events.filter(event => !isToday(event.time));

            if (historyEvents.length === 0) {
                showModal(
                    "Nothing to delete",
                    "There are no events in History.",
                    null,
                    "OK"
                );
                return;
            }

            showModal(
                "Delete all history?",
                "Every history event will be permanently deleted.",
                async () => {
                    try {
                        for (let i = 0; i < historyEvents.length; i++) {
                            await deleteEvent(
                                getEventId(historyEvents[i], i)
                            );
                        }
                        closeModal();
                        await refreshData();
                    } catch (error) {
                        console.error(error);
                        closeModal();
                        showModal(
                            "Delete failed",
                            "The server could not delete history events.",
                            null,
                            "OK"
                        );
                    }
                }
            );
        }

        /* =========================================================
           MODAL HELPERS
        ========================================================= */
        function showModal(title, message, onConfirm, confirmText = "Delete") {
            document.getElementById("modalTitle").textContent = title;
            document.getElementById("modalMessage").textContent = message;

            const confirmBtn = document.getElementById("modalConfirmButton");
            confirmBtn.textContent = confirmText;

            if (onConfirm) {
                confirmBtn.style.display = "inline-block";
                confirmBtn.onclick = onConfirm;
            } else {
                confirmBtn.style.display = "none";
            }

            document.getElementById("confirmModal").classList.add("show");
        }

        function closeModal() {
            document.getElementById("confirmModal").classList.remove("show");
        }

        /* =========================================================
           HISTORY SCROLL
        ========================================================= */
        function scrollToHistory() {
            document
                .getElementById("historySection")
                .scrollIntoView({
                    behavior: "smooth"
                });
        }

        /* =========================================================
           START
        ========================================================= */
        renderStudents();
        refreshData();

        setInterval(refreshData, 2000);
    </script>
</body>
</html>
